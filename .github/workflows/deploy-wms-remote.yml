name: Deploy WMS to remote APEX

# Auto-deploys to the shared remote server ("wms_remote" in .claude/skills/deploy/SKILL.md
# section 1) whenever a merge lands on main. Mirrors the manual procedure documented there:
# db/ddl (new files only, not idempotent) -> db/plsql (full set, idempotent) -> pages/.apx
# (clean-copy build + direct `apex import -id`). db/seed/ (demo data) is intentionally
# NOT run here -- see README.md section 4, that data is dev/demo only.
#
# Required repo secret:
#   WMS_DB_CONNECT_STRING - full SQLcl connect string, e.g. "26HOUSE/<password>@18.181.77.39:1521/FREEPDB1"
# Add it under Settings -> Secrets and variables -> Actions.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-wms-remote
  cancel-in-progress: false

env:
  WMS_WORKSPACE_ID: "2313406132176276"
  WMS_APP_ID: "100"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            git diff --name-only "$EMPTY_TREE" "$AFTER" > /tmp/changed_files.txt
          else
            git diff --name-only "$BEFORE" "$AFTER" > /tmp/changed_files.txt
          fi
          echo "----- changed files since previous main tip -----"
          cat /tmp/changed_files.txt

          if grep -q '^db/ddl/' /tmp/changed_files.txt; then echo "ddl=true" >> "$GITHUB_OUTPUT"; else echo "ddl=false" >> "$GITHUB_OUTPUT"; fi
          if grep -q '^db/plsql/' /tmp/changed_files.txt; then echo "plsql=true" >> "$GITHUB_OUTPUT"; else echo "plsql=false" >> "$GITHUB_OUTPUT"; fi
          if grep -qE '^(application\.apx|page-groups\.apx|pages/|shared-components/)' /tmp/changed_files.txt; then echo "apex=true" >> "$GITHUB_OUTPUT"; else echo "apex=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node.js
        if: steps.changes.outputs.apex == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java (required by SQLcl)
        if: steps.changes.outputs.ddl == 'true' || steps.changes.outputs.plsql == 'true' || steps.changes.outputs.apex == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SQLcl
        if: steps.changes.outputs.ddl == 'true' || steps.changes.outputs.plsql == 'true' || steps.changes.outputs.apex == 'true'
        run: |
          curl -fL -o /tmp/sqlcl.zip https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip
          unzip -q /tmp/sqlcl.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sqlcl/bin" >> "$GITHUB_PATH"

      - name: Check DB secret is configured
        if: steps.changes.outputs.ddl == 'true' || steps.changes.outputs.plsql == 'true' || steps.changes.outputs.apex == 'true'
        env:
          WMS_DB_CONNECT_STRING: ${{ secrets.WMS_DB_CONNECT_STRING }}
        run: |
          if [ -z "$WMS_DB_CONNECT_STRING" ]; then
            echo "::error::Repo secret WMS_DB_CONNECT_STRING is not set (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Apply new DDL files (db/ddl, not idempotent -- only files added/changed by this merge)
        if: steps.changes.outputs.ddl == 'true'
        env:
          WMS_DB_CONNECT_STRING: ${{ secrets.WMS_DB_CONNECT_STRING }}
        run: bash .github/scripts/deploy-ddl.sh

      - name: Deploy PL/SQL packages (db/plsql, full set, CREATE OR REPLACE is idempotent)
        if: steps.changes.outputs.plsql == 'true'
        env:
          WMS_DB_CONNECT_STRING: ${{ secrets.WMS_DB_CONNECT_STRING }}
        run: bash .github/scripts/deploy-plsql.sh

      - name: Check for PL/SQL compile errors
        if: steps.changes.outputs.plsql == 'true' || steps.changes.outputs.ddl == 'true'
        env:
          WMS_DB_CONNECT_STRING: ${{ secrets.WMS_DB_CONNECT_STRING }}
        run: bash .github/scripts/check-plsql-errors.sh

      - name: Build clean APEXlang app copy
        if: steps.changes.outputs.apex == 'true'
        run: |
          CLEAN="$RUNNER_TEMP/26house-clean-app"
          rm -rf "$CLEAN" && mkdir -p "$CLEAN"
          cp application.apx page-groups.apx "$CLEAN/"
          cp -r pages shared-components deployments .apex "$CLEAN/"
          echo "CLEAN_APP_PATH=$CLEAN" >> "$GITHUB_ENV"

      - name: Local APEXlang lint (advisory only, known false positives documented in CLAUDE.md)
        if: steps.changes.outputs.apex == 'true'
        run: node apexlang/tools/apexctl.mjs apexlang validate --app-path "$CLEAN_APP_PATH" || true

      - name: Import APEX pages to remote (id override required, see SKILL.md section 5B)
        if: steps.changes.outputs.apex == 'true'
        env:
          WMS_DB_CONNECT_STRING: ${{ secrets.WMS_DB_CONNECT_STRING }}
        run: bash .github/scripts/import-apex.sh

      - name: Verify import (page count sanity check)
        if: steps.changes.outputs.apex == 'true'
        env:
          WMS_DB_CONNECT_STRING: ${{ secrets.WMS_DB_CONNECT_STRING }}
        run: bash .github/scripts/verify-import.sh
